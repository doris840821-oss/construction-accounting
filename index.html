<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>竑順／吉諦 工地帳務管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#1a1a1a;}
input,select,textarea{font-family:inherit;font-size:13px;border:0.5px solid #ccc;border-radius:6px;padding:6px 9px;background:#fff;color:#1a1a1a;width:100%;box-sizing:border-box;}
button{cursor:pointer;font-family:inherit;}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;padding:7px 9px;border-bottom:0.5px solid #e0e0e0;color:#888;font-weight:500;font-size:11px;white-space:nowrap;}
.tbl td{padding:8px 9px;border-bottom:0.5px solid #e0e0e0;vertical-align:middle;}
.tbl tr:hover td{background:#f5f5f7;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:#fff;border-radius:12px;padding:22px;width:min(560px,95vw);max-height:90vh;overflow-y:auto;}
.modal-sm{background:#fff;border-radius:12px;padding:22px;width:min(420px,95vw);max-height:90vh;overflow-y:auto;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.hdr{background:#fff;border-bottom:0.5px solid #e0e0e0;padding:0 14px;display:flex;align-items:center;gap:8px;min-height:50px;flex-wrap:wrap;}
.main{padding:14px;max-width:1100px;margin:0 auto;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const fmt=n=>isNaN(n)||n===''?'0':Number(n).toLocaleString('zh-TW');
const today=()=>new Date().toISOString().split('T')[0];
const mk=(co,k)=>`hs26_${co}_${k}`;
const DEF_SITES=['板橋遠雄'];
const DEF_VENDORS=['吉諦','哲在'];
const CO_COLOR={'竑順':'#1D9E75','吉諦':'#378ADD'};
const EXPENSE_CATS=['工人支出','五金材料支出'];
const FREQ_OPTS=['每月','每兩月','每季','每年','單次'];
const PAY_METHODS=['現金收款','銀行匯款','支票'];

function store_get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function store_set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

function make(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)Object.keys(props).forEach(k=>{
    if(k==='class')e.className=props[k];
    else if(k==='style'&&typeof props[k]==='object')Object.assign(e.style,props[k]);
    else if(k==='onclick')e.addEventListener('click',props[k]);
    else e[k]=props[k];
  });
  kids.flat(9).forEach(c=>{
    if(c==null)return;
    e.appendChild(c instanceof Node?c:document.createTextNode(String(c)));
  });
  return e;
}
const div=(p,...k)=>make('div',p,...k);
const span=(p,...k)=>make('span',p,...k);
const td=(p,...k)=>make('td',p,...k);
const th=(p,...k)=>make('th',p,...k);
const tr=(...k)=>make('tr',null,...k);

function mkBtn(text,bg,color,onclick,extra={}){
  const b=document.createElement('button');
  b.textContent=text;
  Object.assign(b.style,{background:bg,color,border:'none',borderRadius:'6px',padding:'6px 12px',fontSize:'12px',fontWeight:'600',whiteSpace:'nowrap',cursor:'pointer',...extra});
  b.addEventListener('click',onclick);
  return b;
}
function ghostBtn(text,onclick,color='#888'){
  const b=document.createElement('button');
  b.textContent=text;
  Object.assign(b.style,{background:'transparent',border:'0.5px solid #ccc',borderRadius:'6px',padding:'5px 10px',fontSize:'12px',color,cursor:'pointer'});
  b.addEventListener('click',onclick);
  return b;
}
function smBtn(text,onclick,color='#888'){
  const b=document.createElement('button');
  b.textContent=text;
  Object.assign(b.style,{background:'transparent',border:'0.5px solid #ccc',borderRadius:'6px',padding:'2px 6px',fontSize:'10px',color,cursor:'pointer',marginLeft:'3px'});
  b.addEventListener('click',onclick);
  return b;
}
function pill(text,active,color,onclick){
  const b=document.createElement('button');
  b.textContent=text;
  Object.assign(b.style,{padding:'5px 14px',borderRadius:'20px',border:'none',fontSize:'12px',fontWeight:active?'600':'400',background:active?color:'#f0f0f0',color:active?'#fff':'#888',cursor:'pointer'});
  b.addEventListener('click',onclick);
  return b;
}
function metric(label,value,color){
  const d=div({style:{background:'#f5f5f7',borderRadius:'8px',padding:'11px 13px',borderLeft:`3px solid ${color}`}});
  d.appendChild(div({style:{fontSize:'11px',color:'#888',marginBottom:'2px'}},label));
  d.appendChild(div({style:{fontSize:'16px',fontWeight:'600',color}},value));
  return d;
}
function lbl(text){return make('label',{style:{fontSize:'11px',color:'#888',marginBottom:'3px',display:'block'}},text);}
function field(labelText,inputEl,full=false){
  const d=div({style:full?{gridColumn:'1/-1'}:{}});
  d.appendChild(lbl(labelText));
  d.appendChild(inputEl);
  return d;
}
function mkInp(val,onchange,type='text',ph=''){
  const e=make('input',{type,value:val||'',placeholder:ph});
  e.addEventListener('input',ev=>onchange(ev.target.value));
  return e;
}
function mkSel(val,opts,onchange){
  const e=make('select',{});
  opts.forEach(([v,t])=>{const o=make('option',{value:v},t||v);if(String(v)===String(val))o.selected=true;e.appendChild(o);});
  e.addEventListener('change',ev=>onchange(ev.target.value));
  return e;
}
function mkTa(val,onchange,ph=''){
  const e=make('textarea',{placeholder:ph,style:{height:'50px',resize:'vertical'}},val||'');
  e.addEventListener('input',ev=>onchange(ev.target.value));
  return e;
}

// 狀態
let ST={
  co:null,view:'dashboard',
  invoices:[],expItems:[],companyExp:[],splits:[],
  sites:[...DEF_SITES],vendors:[...DEF_VENDORS],
  checkFilter:'全部',expFilter:'全部',filterSite:'全部',splitSite:'全部',search:'',
  modal:null,payModalId:null,
  editInvId:null,editExpId:null,editCompExpId:null,editSplitId:null,
  addingSite:false,addingVendor:false,
  invForm:{},expForm:{},compExpForm:{},payEntry:{},splitForm:{}
};
function upd(patch){Object.assign(ST,patch);render();}
function saveK(k,d){store_set(mk(ST.co,k),d);}

// 直接修改表單值，不重新 render
function setInvForm(k,v){ST.invForm[k]=v;}
function setExpForm(k,v){ST.expForm[k]=v;}
function setPayForm(k,v){ST.payEntry[k]=v;}
function setCompExpForm(k,v){ST.compExpForm[k]=v;}
function setSplitForm(k,v){ST.splitForm[k]=v;}

function emptyInv(){return{date:today(),site:ST.sites[0]||'',vendor:'',inv_no:'',inv_date:'',total_amount:'',discount:'',note:'',payments:[]};}
function emptyExp(){return{date:today(),site:ST.sites[0]||'',vendor:'',category:'工人支出',amount:'',note:''};}
function emptyPay(){return{date:today(),check_date:'',amount:'',method:'現金收款',note:''};}
function emptySplit(){return{date:today(),site:'',geo:'',sister:'',note:''};}
function emptyCompExp(){return{item:'',period:'',amount:'',freq:'每月',note:'';};}

// 自動新增每月固定公司支出
function autoAddMonthlyExpenses(co){
  if(co!=='竑順')return; // 只有竑順需要
  const now=new Date();
  const day=now.getDate();
  if(day!==1)return; // 只在每月1號執行
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const lastKey=mk(co,'auto_month');
  const last=store_get(lastKey);
  if(last===ym)return; // 本月已新增過，不重複
  const fixed=[
    {item:'董事長薪水',amount:'50000'},
    {item:'公司租金',amount:'10000'},
    {item:'會計費用',amount:'40000'},
  ];
  const existing=store_get(mk(co,'company_exp'))||[];
  const toAdd=fixed.map(f=>({
    id:Date.now()+Math.random(),
    item:f.item,period:ym,amount:f.amount,freq:'每月',note:`${ym} 自動新增`
  }));
  const updated=[...toAdd,...existing];
  store_set(mk(co,'company_exp'),updated);
  store_set(lastKey,ym);
}function loadAll(co){
  const p={co,view:'dashboard',modal:null,checkFilter:'全部',expFilter:'全部',filterSite:'全部',splitSite:'全部',search:''};
  [['invoices','invoices',[]],['expenses','expItems',[]],['company_exp','companyExp',[]],
   ['splits','splits',[]],['sites','sites',DEF_SITES],['vendors','vendors',DEF_VENDORS]
  ].forEach(([k,f,d])=>{const v=store_get(mk(co,k));p[f]=v!==null?v:[...d];});
  autoAddMonthlyExpenses(co); // 自動新增每月固定支出
  // 重新讀取（因為 auto 可能剛寫入）
  const ce=store_get(mk(co,'company_exp'));
  if(ce)p.companyExp=ce;
  upd(p);
}

const getNet=r=>Math.max(0,(Number(r.total_amount)||0)-(Number(r.discount)||0));
const getPaid=r=>(r.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
const getReserved=r=>Math.max(0,getNet(r)-getPaid(r));
const isSettled=r=>getReserved(r)<=0;

function siteStats(){
  const m={};
  ST.invoices.forEach(r=>{
    if(!m[r.site])m[r.site]={received:0,reserved:0,invoice:0,worker:0,material:0};
    m[r.site].received+=getPaid(r);m[r.site].reserved+=getReserved(r);m[r.site].invoice+=Number(r.total_amount)||0;
  });
  ST.expItems.forEach(r=>{
    if(!m[r.site])m[r.site]={received:0,reserved:0,invoice:0,worker:0,material:0};
    if(r.category==='工人支出')m[r.site].worker+=Number(r.amount)||0;
    else m[r.site].material+=Number(r.amount)||0;
  });
  return m;
}

// Actions
function delInvoice(id){if(!confirm('確定刪除此發票？'))return;const invoices=ST.invoices.filter(r=>r.id!==id);saveK('invoices',invoices);upd({invoices});}
function delPayment(invId,payId){
  const invoices=ST.invoices.map(r=>{
    if(r.id!==invId)return r;
    return Object.assign({},r,{payments:r.payments.filter(p=>p.id!==payId)});
  });
  saveK('invoices',invoices);upd({invoices});
}
function delExpItem(id){if(!confirm('確定刪除？'))return;const expItems=ST.expItems.filter(r=>r.id!==id);saveK('expenses',expItems);upd({expItems});}
function delCompExp(id){const companyExp=ST.companyExp.filter(e=>e.id!==id);saveK('company_exp',companyExp);upd({companyExp});}
function delSplit(id){const splits=ST.splits.filter(s=>s.id!==id);saveK('splits',splits);upd({splits});}

function saveInvoice(){
  const f=ST.invForm;
  if(!f.total_amount||!f.site)return alert('請填寫工地和發票金額');
  const rec=Object.assign({},f,{id:ST.editInvId||Date.now(),payments:f.payments||[]});
  const invoices=ST.editInvId?ST.invoices.map(r=>r.id===ST.editInvId?rec:r):[rec,...ST.invoices];
  saveK('invoices',invoices);upd({invoices,modal:null,editInvId:null});
}
function saveExpItem(){
  const f=ST.expForm;
  if(!f.amount||!f.site)return alert('請填寫工地和金額');
  const rec=Object.assign({},f,{id:ST.editExpId||Date.now()});
  const expItems=ST.editExpId?ST.expItems.map(r=>r.id===ST.editExpId?rec:r):[rec,...ST.expItems];
  saveK('expenses',expItems);upd({expItems,modal:null,editExpId:null});
}
function addPayment(){
  const f=ST.payEntry;
  if(!f.amount)return alert('請填寫金額');
  const invoices=ST.invoices.map(r=>{
    if(r.id!==ST.payModalId)return r;
    return Object.assign({},r,{payments:[...(r.payments||[]),Object.assign({},f,{id:Date.now()})]});
  });
  saveK('invoices',invoices);upd({invoices,modal:null,payModalId:null,payEntry:emptyPay()});
}
function saveCompExp(){
  const f=ST.compExpForm;
  if(!f.item||!f.amount)return alert('請填寫項目和金額');
  const rec=Object.assign({},f,{id:ST.editCompExpId||Date.now()});
  const companyExp=ST.editCompExpId?ST.companyExp.map(e=>e.id===ST.editCompExpId?rec:e):[rec,...ST.companyExp];
  saveK('company_exp',companyExp);upd({companyExp,modal:null,editCompExpId:null});
}
function saveSplit(){
  const f=ST.splitForm;
  if(!f.date)return alert('請填寫日期');
  const rec=Object.assign({},f,{id:ST.editSplitId||Date.now()});
  const splits=ST.editSplitId?ST.splits.map(s=>s.id===ST.editSplitId?rec:s):[rec,...ST.splits];
  saveK('splits',splits);upd({splits,modal:null,editSplitId:null});
}

function addSiteItem(val,cb){
  const v=val.trim();if(!v)return;
  const sites=ST.sites.includes(v)?ST.sites:[...ST.sites,v];
  saveK('sites',sites);cb(v);upd({sites,addingSite:false});
}
function addVendorItem(val,cb){
  const v=val.trim();if(!v)return;
  const vendors=ST.vendors.includes(v)?ST.vendors:[...ST.vendors,v];
  saveK('vendors',vendors);cb(v);upd({vendors,addingVendor:false});
}
function delSiteItem(x){const sites=ST.sites.filter(s=>s!==x);saveK('sites',sites);upd({sites});}
function delVendorItem(x){const vendors=ST.vendors.filter(v=>v!==x);saveK('vendors',vendors);upd({vendors});}

function siteSelectUI(val,onChangeFn){
  const wrap=div({style:{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}});
  if(ST.addingSite){
    const inp=make('input',{type:'text',placeholder:'新工地名稱...',style:{flex:1}});
    const doAdd=function(){addSiteItem(inp.value,onChangeFn);};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing)doAdd();});
    const ok=mkBtn('確認','#1D9E75','#fff',doAdd);
    const cx=ghostBtn('✕',()=>upd({addingSite:false}));
    wrap.appendChild(inp);wrap.appendChild(ok);wrap.appendChild(cx);
  }else{
    const s=mkSel(val,[['','請選擇工地'],...ST.sites.map(x=>[x,x])],onChangeFn);
    s.style.flex='1';
    wrap.appendChild(s);
    wrap.appendChild(ghostBtn('＋ 新增',()=>upd({addingSite:true})));
    if(val)wrap.appendChild(ghostBtn('刪除',()=>{if(confirm(`確定刪除工地「${val}」？`)){delSiteItem(val);onChangeFn('');}  },'#A32D2D'));
  }
  return wrap;
}
function vendorSelectUI(val,onChangeFn){
  const wrap=div({style:{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}});
  if(ST.addingVendor){
    const inp=make('input',{type:'text',placeholder:'新廠商名稱...',style:{flex:1}});
    const doAdd=function(){addVendorItem(inp.value,onChangeFn);};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing)doAdd();});
    const ok=mkBtn('確認','#1D9E75','#fff',doAdd);
    const cx=ghostBtn('✕',()=>upd({addingVendor:false}));
    wrap.appendChild(inp);wrap.appendChild(ok);wrap.appendChild(cx);
  }else{
    const s=mkSel(val,[['','請選擇廠商'],...ST.vendors.map(x=>[x,x])],onChangeFn);
    s.style.flex='1';
    wrap.appendChild(s);
    wrap.appendChild(ghostBtn('＋ 新增',()=>upd({addingVendor:true})));
    if(val)wrap.appendChild(ghostBtn('刪除',()=>{if(confirm(`確定刪除廠商「${val}」？`)){delVendorItem(val);onChangeFn('');}  },'#A32D2D'));
  }
  return wrap;
}

function modalWrap(inner,onClose){
  const ov=div({class:'ov'});
  ov.addEventListener('click',e=>{if(e.target===ov)onClose();});
  ov.appendChild(inner);
  return ov;
}

function renderInvModal(){
  const accent=CO_COLOR[ST.co];
  const f=ST.invForm;
  const box=div({class:'modal'});
  box.appendChild(div({style:{fontWeight:'700',fontSize:'15px',marginBottom:'16px'}},ST.editInvId?'編輯發票':'新增開出發票'));
  const fg=div({class:'fg'});
  fg.appendChild(field('日期',mkInp(f.date,v=>setInvForm('date',v),'date')));
  fg.appendChild(field('發票號碼',mkInp(f.inv_no,v=>setInvForm('inv_no',v),'text','發票號碼')));
  fg.appendChild(field('工地',siteSelectUI(f.site,v=>{setInvForm('site',v);}),true));
  fg.appendChild(field('廠商',vendorSelectUI(f.vendor,v=>{setInvForm('vendor',v);}),true));
  fg.appendChild(field('發票日期',mkInp(f.inv_date,v=>setInvForm('inv_date',v),'date')));
  fg.appendChild(field('發票金額',mkInp(f.total_amount,v=>setInvForm('total_amount',v),'number','0')));
  fg.appendChild(field('折讓金額',mkInp(f.discount,v=>setInvForm('discount',v),'number','0（無折讓可留空）')));
  box.appendChild(fg);
  box.appendChild(field('備註',mkTa(f.note,v=>setInvForm('note',v),'備註...')));
  const row=div({style:{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'12px'}});
  row.appendChild(ghostBtn('取消',()=>upd({modal:null})));
  row.appendChild(mkBtn('儲存',accent,'#fff',saveInvoice));
  box.appendChild(row);
  return modalWrap(box,()=>upd({modal:null}));
}

function renderExpModal(){
  const f=ST.expForm;
  const box=div({class:'modal'});
  box.appendChild(div({style:{fontWeight:'700',fontSize:'15px',marginBottom:'16px'}},ST.editExpId?'編輯支出':'新增支出'));
  const fg=div({class:'fg'});
  fg.appendChild(field('日期',mkInp(f.date,v=>setExpForm('date',v),'date')));
  fg.appendChild(field('費用類別',mkSel(f.category,EXPENSE_CATS.map(c=>[c,c]),v=>setExpForm('category',v))));
  fg.appendChild(field('工地',siteSelectUI(f.site,v=>{setExpForm('site',v);}),true));
  fg.appendChild(field('廠商',vendorSelectUI(f.vendor,v=>{setExpForm('vendor',v);}),true));
  fg.appendChild(field('金額',mkInp(f.amount,v=>setExpForm('amount',v),'number','0')));
  box.appendChild(fg);
  box.appendChild(field('備註',mkTa(f.note,v=>setExpForm('note',v),'備註...')));
  const row=div({style:{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'12px'}});
  row.appendChild(ghostBtn('取消',()=>upd({modal:null})));
  row.appendChild(mkBtn('儲存','#E24B4A','#fff',saveExpItem));
  box.appendChild(row);
  return modalWrap(box,()=>upd({modal:null}));
}

function renderPayModal(){
  const accent=CO_COLOR[ST.co];
  const inv=ST.invoices.find(r=>r.id===ST.payModalId);
  if(!inv)return null;
  const f=ST.payEntry;
  const box=div({class:'modal-sm'});
  box.appendChild(div({style:{fontWeight:'700',fontSize:'15px',marginBottom:'4px'}},'新增收款記錄'));
  box.appendChild(div({style:{fontSize:'12px',color:'#888',marginBottom:'14px'}},`${inv.vendor||inv.site} · 尚未收款 NT$ ${fmt(getReserved(inv))}`));
  const grid=div({style:{display:'grid',gap:'10px'}});
  grid.appendChild(field('收款日期',mkInp(f.date,v=>setPayForm('date',v),'date')));
  grid.appendChild(field('匯款／支票日期',mkInp(f.check_date,v=>setPayForm('check_date',v),'date')));
  grid.appendChild(field('收款金額',mkInp(f.amount,v=>setPayForm('amount',v),'number',`最多 NT$ ${fmt(getReserved(inv))}`)));
  grid.appendChild(field('收款方式',mkSel(f.method,PAY_METHODS.map(m=>[m,m]),v=>setPayForm('method',v))));
  grid.appendChild(field('備註',mkInp(f.note,v=>setPayForm('note',v),'text','備註...')));
  box.appendChild(grid);
  const row=div({style:{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'14px'}});
  row.appendChild(ghostBtn('取消',()=>upd({modal:null,payModalId:null})));
  row.appendChild(mkBtn('確認收款',accent,'#fff',addPayment));
  box.appendChild(row);
  return modalWrap(box,()=>upd({modal:null,payModalId:null}));
}

function renderCompExpModal(){
  const accent=CO_COLOR[ST.co];
  const f=ST.compExpForm;
  const box=div({class:'modal-sm'});
  box.appendChild(div({style:{fontWeight:'700',fontSize:'15px',marginBottom:'14px'}},ST.editCompExpId?'編輯公司支出':'新增公司支出'));
  const grid=div({style:{display:'grid',gap:'10px'}});
  grid.appendChild(field('項目',mkInp(f.item,v=>setCompExpForm('item',v),'text','例：董事長薪水')));
  grid.appendChild(field('區間',mkInp(f.period,v=>setCompExpForm('period',v),'text','例：2026-01')));
  grid.appendChild(field('金額',mkInp(f.amount,v=>setCompExpForm('amount',v),'number','0')));
  grid.appendChild(field('頻率',mkSel(f.freq,FREQ_OPTS.map(x=>[x,x]),v=>setCompExpForm('freq',v))));
  grid.appendChild(field('備註',mkInp(f.note,v=>setCompExpForm('note',v),'text','備註...')));
  box.appendChild(grid);
  const row=div({style:{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'14px'}});
  row.appendChild(ghostBtn('取消',()=>upd({modal:null})));
  row.appendChild(mkBtn('儲存',accent,'#fff',saveCompExp));
  box.appendChild(row);
  return modalWrap(box,()=>upd({modal:null}));
}

function renderSplitModal(){
  const accent=CO_COLOR[ST.co];
  const f=ST.splitForm;
  const box=div({class:'modal-sm'});

function exportCSV(){

    else(inv.payments||[]).forEach((p,i)=>rows.push([i===0?'發票':'',i===0?inv.date:'',i===0?inv.site:'',i===0?(inv.vendor||''):'',i===0?(inv.inv_no||''):'',i===0?(inv.inv_date||''):'',i===0?(inv.total_amount||''):'',i===0?(inv.discount||''):'',i===0?(inv.note||''):'',p.date||'',p.check_date||'',p.amount||'',p.method||'',p.note||'']));
  });
  rows.push([]);rows.push(['#類型','日期','工地','廠商','費用類別','金額','備註']);
  expItems.forEach(e=>rows.push(['支出',e.date,e.site,e.vendor||'',e.category,e.amount||'',e.note||'']));
  if(co==='竑順'&&companyExp.length){rows.push([]);rows.push(['#類型','項目','區間','金額','頻率','備註']);companyExp.forEach(e=>rows.push(['公司支出',e.item,e.period||'',e.amount||'',e.freq,e.note||'']));}
  if(co==='吉諦'&&splits.length){rows.push([]);rows.push(['#類型','日期','工地','分給吉哥','分給姐姐','備註']);splits.forEach(s=>rows.push(['分帳',s.date,s.site||'',s.geo||'',s.sister||'',s.note||'']));}
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${co}_帳務備份_${today()}.csv`;a.click();

function importCSV(file){
  if(!confirm('匯入會覆蓋目前所有資料，確定繼續？'))return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const text=ev.target.result.replace(/^\uFEFF/,'');
      const rows=text.split('\n').map(r=>{const res=[];let cur='',inQ=false;for(let i=0;i<r.length;i++){if(r[i]==='"'){if(inQ&&r[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(r[i]===','&&!inQ){res.push(cur.trim());cur='';}else cur+=r[i];}res.push(cur.trim());return res;});
      const ni=[],ne=[],nc=[],ns=[];let mode='',cur=null;
      for(const row of rows){
        if(!row[0])continue;const t=row[0];
        if(t==='#類型'){if(row[4]==='發票號碼')mode='inv';else if(row[4]==='費用類別')mode='exp';else if(row[1]==='項目')mode='comp';else if(row[3]==='分給吉哥')mode='split';continue;}
        if(mode==='inv'){if(t==='發票'){if(cur)ni.push(cur);cur={id:Date.now()+Math.random(),date:row[1],site:row[2],vendor:row[3],inv_no:row[4],inv_date:row[5],total_amount:row[6],discount:row[7],note:row[8],payments:[]};if(row[9])cur.payments.push({id:Date.now()+Math.random(),date:row[9],check_date:row[10],amount:row[11],method:row[12],note:row[13]});}else if(t===''&&cur&&row[9])cur.payments.push({id:Date.now()+Math.random(),date:row[9],check_date:row[10],amount:row[11],method:row[12],note:row[13]});}
        else if(mode==='exp'&&t==='支出')ne.push({id:Date.now()+Math.random(),date:row[1],site:row[2],vendor:row[3],category:row[4],amount:row[5],note:row[6]});
        else if(mode==='comp'&&t==='公司支出')nc.push({id:Date.now()+Math.random(),item:row[1],period:row[2],amount:row[3],freq:row[4],note:row[5]});
        else if(mode==='split'&&t==='分帳')ns.push({id:Date.now()+Math.random(),date:row[1],site:row[2],geo:row[3],sister:row[4],note:row[5]});
      }
      if(cur)ni.push(cur);
      saveK('invoices',ni);saveK('expenses',ne);
      if(ST.co==='竑順')saveK('company_exp',nc);
      if(ST.co==='吉諦')saveK('splits',ns);
      alert('匯入成功！');loadAll(ST.co);
    }catch(err){alert('匯入失敗，請確認檔案格式正確。');}
  };
  reader.readAsText(file,'UTF-8');
}

      if(!settled){
        const addPayBtn=document.createElement('button');
        addPayBtn.textContent='+ 新增收款記錄';
        addPayBtn.style.cssText=`width:100%;padding:8px;background:#E8F5E9;border:0.5px solid ${accent};border-radius:8px;cursor:pointer;color:${accent};font-weight:600;font-size:13px;`;
        addPayBtn.addEventListener('click',function(){upd({modal:'pay',payModalId:inv.id,payEntry:emptyPay()});});
        card.appendChild(addPayBtn);
      }
      main.appendChild(card);
    });
  }

  // 支出管理
  if(view==='expenses'){
    const topRow=div({style:{display:'flex',justifyContent:'space-between',marginBottom:'12px',flexWrap:'wrap',gap:'8px'}});
    const pills=div({style:{display:'flex',gap:'6px'}});
    ['全部',...EXPENSE_CATS].forEach(f=>pills.appendChild(pill(f,expFilter===f,accent,()=>upd({expFilter:f}))));
    topRow.appendChild(pills);
    topRow.appendChild(mkBtn('+ 新增支出','#E24B4A','#fff',()=>upd({modal:'exp',editExpId:null,expForm:emptyExp(),addingSite:false,addingVendor:false})));
    main.appendChild(topRow);
    const mg=div({class:'mg'});
    mg.appendChild(metric('支出合計',`NT$ ${fmt(totalExpense)}`,'#E24B4A'));
    EXPENSE_CATS.forEach(c=>mg.appendChild(metric(c,`NT$ ${fmt(expItems.filter(e=>e.category===c).reduce((s,e)=>s+(Number(e.amount)||0),0))}`,'#BA7517')));
    main.appendChild(mg);
    const card=div({class:'card'});const ow=div({style:{overflowX:'auto'}});
    const tbl=make('table',{class:'tbl'});
    tbl.appendChild(make('thead',{},tr(th({},'日期'),th({},'工地'),th({},'廠商'),th({},'費用類別'),th({},'金額'),th({},'備註'),th({},''))));
    const tbody=make('tbody');
    if(!filteredExp.length)tbody.appendChild(tr(make('td',{colspan:7,style:{textAlign:'center',color:'#888',padding:'28px'}},'尚無支出紀錄')));
    filteredExp.forEach(function(e){
      const eid=e.id;
      const badge=span({style:{display:'inline-block',padding:'2px 7px',borderRadius:'4px',fontSize:'11px',fontWeight:'500',background:e.category==='工人支出'?'#FAEEDA':'#E6F1FB',color:e.category==='工人支出'?'#854F0B':'#185FA5'}},e.category);
      const editB=document.createElement('button');
      editB.textContent='✎';editB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#888;cursor:pointer;margin-right:3px;';
      editB.addEventListener('click',function(){upd({modal:'exp',editExpId:eid,expForm:Object.assign({},e),addingSite:false,addingVendor:false});});
      const delB=document.createElement('button');
      delB.textContent='✕';delB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#A32D2D;cursor:pointer;';
      delB.addEventListener('click',function(){delExpItem(eid);});
      const opTd=td({});opTd.appendChild(editB);opTd.appendChild(delB);
      tbody.appendChild(tr(td({},e.date),td({},e.site),td({},e.vendor||'-'),td({},badge),td({style:{color:'#A32D2D',fontWeight:'600'}},`NT$ ${fmt(e.amount)}`),td({style:{maxWidth:'130px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},e.note||'-'),opTd));
    });
    tbl.appendChild(tbody);ow.appendChild(tbl);card.appendChild(ow);main.appendChild(card);
  }

  // 帳務紀錄
  if(view==='ledger'){
    const topRow=div({style:{display:'flex',justifyContent:'space-between',marginBottom:'12px',flexWrap:'wrap',gap:'8px'}});
    const left=div({style:{display:'flex',gap:'8px',alignItems:'center'}});
    const si=make('input',{type:'text',placeholder:'搜尋工地/廠商...',style:{width:'160px'},value:search});
    si.addEventListener('input',e=>upd({search:e.target.value}));
    left.appendChild(si);
    left.appendChild(mkSel(filterSite,[['全部','全部'],...sites.map(x=>[x,x])],v=>upd({filterSite:v})));
    topRow.appendChild(left);
    topRow.appendChild(span({style:{fontSize:'12px',color:'#888'}},`共 ${ledger.length} 筆`));
    main.appendChild(topRow);
    const card=div({class:'card'});const ow=div({style:{overflowX:'auto'}});
    const tbl=make('table',{class:'tbl'});
    tbl.appendChild(make('thead',{},tr(th({},'日期'),th({},'工地'),th({},'廠商'),th({},'類型'),th({},'收/支'),th({},'發票金額'),th({},'已收/已付'),th({},'保留款'),th({},'備註'))));
    const tbody=make('tbody');
    if(!ledger.length)tbody.appendChild(tr(make('td',{colspan:9,style:{textAlign:'center',color:'#888',padding:'28px'}},'尚無紀錄')));
    ledger.forEach(r=>{
      const typeBadge=span({style:{display:'inline-block',padding:'2px 7px',borderRadius:'4px',fontSize:'11px',fontWeight:'500',background:r.io==='收入'?'#E1F5EE':'#F3F4F6',color:r.io==='收入'?accent:'#555'}},r.type);
      const ioBadge=span({style:{display:'inline-block',padding:'2px 7px',borderRadius:'4px',fontSize:'11px',fontWeight:'500',background:r.io==='收入'?'#EAF3DE':'#FCEBEB',color:r.io==='收入'?'#3B6D11':'#A32D2D'}},r.io);
      tbody.appendChild(tr(td({},r.date),td({},r.site),td({},r.vendor||'-'),td({},typeBadge),td({},ioBadge),td({style:{fontWeight:'600'}},`NT$ ${fmt(r.amount)}`),td({style:{color:r.io==='收入'?accent:'#A32D2D',fontWeight:'500'}},`NT$ ${fmt(r.paid)}`),td({style:{color:r.reserved>0?'#854F0B':'#3B6D11'}},r.reserved>0?`NT$ ${fmt(r.reserved)}`:'✓'),td({style:{maxWidth:'120px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.note||'-')));
    });
    tbl.appendChild(tbody);ow.appendChild(tbl);card.appendChild(ow);main.appendChild(card);
  }

  // 公司支出
  if(view==='company_exp'){
    const topRow=div({style:{display:'flex',justifyContent:'space-between',marginBottom:'12px'}});
    topRow.appendChild(div({style:{fontWeight:'600',fontSize:'14px'}},'公司固定支出'));
    topRow.appendChild(mkBtn('+ 新增',accent,'#fff',()=>upd({modal:'compExp',editCompExpId:null,compExpForm:emptyCompExp()})));
    main.appendChild(topRow);
    const byFreq={};FREQ_OPTS.forEach(f=>byFreq[f]=[]);companyExp.forEach(e=>{if(byFreq[e.freq])byFreq[e.freq].push(e);});
    const mg=div({class:'mg'});
    FREQ_OPTS.filter(f=>byFreq[f].length).forEach(f=>mg.appendChild(metric(f,`NT$ ${fmt(byFreq[f].reduce((s,e)=>s+(Number(e.amount)||0),0))}`,accent)));
    mg.appendChild(metric('全部合計',`NT$ ${fmt(totalCompanyExp)}`,'#E24B4A'));
    main.appendChild(mg);
    FREQ_OPTS.filter(f=>byFreq[f].length).forEach(function(f){
      const card=div({class:'card'});
      const tot=byFreq[f].reduce((s,e)=>s+(Number(e.amount)||0),0);
      const title=div({style:{fontWeight:'600',fontSize:'13px',marginBottom:'8px'}},`${f}支出 `);
      title.appendChild(span({style:{color:'#A32D2D',fontWeight:'400'}},`NT$ ${fmt(tot)}`));
      card.appendChild(title);
      const tbl=make('table',{class:'tbl'});
      tbl.appendChild(make('thead',{},tr(th({},'項目'),th({},'區間'),th({},'金額'),th({},'備註'),th({},'操作'))));
      const tbody=make('tbody');
      byFreq[f].forEach(function(e){
        const eid=e.id;
        const editB=document.createElement('button');
        editB.textContent='✎';editB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#888;cursor:pointer;margin-right:3px;';
        editB.addEventListener('click',function(){upd({modal:'compExp',editCompExpId:eid,compExpForm:Object.assign({},e)});});
        const delB=document.createElement('button');
        delB.textContent='✕';delB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#A32D2D;cursor:pointer;';
        delB.addEventListener('click',function(){delCompExp(eid);});
        const opTd=td({});opTd.appendChild(editB);opTd.appendChild(delB);
        tbody.appendChild(tr(td({style:{fontWeight:'500'}},e.item),td({},e.period||'-'),td({style:{color:'#A32D2D',fontWeight:'500'}},`NT$ ${fmt(e.amount)}`),td({},e.note||'-'),opTd));
      });
      tbl.appendChild(tbody);card.appendChild(tbl);main.appendChild(card);
    });
    if(!companyExp.length)main.appendChild(div({class:'card',style:{textAlign:'center',color:'#888',padding:'32px'}},'尚無支出紀錄'));
  }

  // 分帳記錄
  if(view==='split'){
    const topRow=div({style:{display:'flex',justifyContent:'space-between',marginBottom:'12px',flexWrap:'wrap',gap:'8px'}});
    const left=div({style:{display:'flex',gap:'8px',alignItems:'center'}});
    left.appendChild(div({style:{fontWeight:'600',fontSize:'14px'}},'分帳記錄'));
    left.appendChild(mkSel(splitSite,[['全部','全部'],...sites.map(x=>[x,x])],v=>upd({splitSite:v})));
    topRow.appendChild(left);
    topRow.appendChild(mkBtn('+ 新增分帳',accent,'#fff',()=>upd({modal:'split',editSplitId:null,splitForm:emptySplit()})));
    main.appendChild(topRow);
    const mg=div({class:'mg'});
    mg.appendChild(metric('累計分給吉哥',`NT$ ${fmt(filteredSplits.reduce((s,r)=>s+(Number(r.geo)||0),0))}`,accent));
    mg.appendChild(metric('累計分給姐姐',`NT$ ${fmt(filteredSplits.reduce((s,r)=>s+(Number(r.sister)||0),0))}`,'#BA7517'));
    mg.appendChild(metric('累計總額',`NT$ ${fmt(filteredSplits.reduce((s,r)=>s+(Number(r.geo)||0)+(Number(r.sister)||0),0))}`,'#6B5EA8'));
    main.appendChild(mg);
    if(!filteredSplits.length)main.appendChild(div({class:'card',style:{textAlign:'center',color:'#888',padding:'36px'}},'尚無分帳紀錄'));
    else{
      const card=div({class:'card'});const ow=div({style:{overflowX:'auto'}});
      const tbl=make('table',{class:'tbl'});
      tbl.appendChild(make('thead',{},tr(th({},'日期'),th({},'工地'),th({},'分給吉哥'),th({},'分給姐姐'),th({},'備註'),th({},'操作'))));
      const tbody=make('tbody');
      filteredSplits.forEach(function(r){
        const sid=r.id;
        const editB=document.createElement('button');
        editB.textContent='✎';editB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#888;cursor:pointer;margin-right:3px;';
        editB.addEventListener('click',function(){upd({modal:'split',editSplitId:sid,splitForm:Object.assign({},r)});});
        const delB=document.createElement('button');
        delB.textContent='✕';delB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#A32D2D;cursor:pointer;';
        delB.addEventListener('click',function(){delSplit(sid);});
        const opTd=td({});opTd.appendChild(editB);opTd.appendChild(delB);
        tbody.appendChild(tr(td({},r.date),td({},r.site||'-'),td({style:{color:accent,fontWeight:'600'}},r.geo?`NT$ ${fmt(r.geo)}`:'-'),td({style:{color:'#854F0B',fontWeight:'600'}},r.sister?`NT$ ${fmt(r.sister)}`:'-'),td({style:{maxWidth:'150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.note||'-'),opTd));
      });
      tbl.appendChild(tbody);ow.appendChild(tbl);card.appendChild(ow);main.appendChild(card);
    }
  }

  // 損益報表
  if(view==='profit'){
    const mg=div({class:'mg'});
    mg.appendChild(metric('已收款',`NT$ ${fmt(totalIncome)}`,accent));
    mg.appendChild(metric('公司固定支出',`NT$ ${fmt(totalCompanyExp)}`,'#E24B4A'));
    mg.appendChild(metric('工地損益',`NT$ ${fmt(grandProfit)}`,grandProfit>=0?'#378ADD':'#E24B4A'));
    mg.appendChild(metric('總損益',`NT$ ${fmt(grandProfit-totalCompanyExp)}`,'#6B5EA8'));
    mg.appendChild(metric('每人可分',`NT$ ${fmt(Math.round((grandProfit-totalCompanyExp)/2))}`,'#BA7517'));
    main.appendChild(mg);
    main.appendChild(div({class:'card',style:{textAlign:'center',color:'#888',fontSize:'13px',padding:'20px'}},'詳細各工地損益一覽請至「總覽」頁面查看'));
  }

  app.appendChild(main);

  if(modal==='inv')app.appendChild(renderInvModal());
  if(modal==='exp')app.appendChild(renderExpModal());
  if(modal==='pay'&&payModalId)app.appendChild(renderPayModal());
  if(modal==='compExp')app.appendChild(renderCompExpModal());
  if(modal==='split')app.appendChild(renderSplitModal());
}

render();
</script>
</body>
</html>

// localStorage 作為快取
function store_get(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function store_set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// Supabase 讀取
async function supa_get(id){
  try{
    var res=await fetch(SUPA_URL+'/rest/v1/records?id=eq.'+encodeURIComponent(id)+'&select=data',{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    var rows=await res.json();
    if(rows&&rows.length>0)return rows[0].data;
    return null;
  }catch(e){return null;}
}

// Supabase 寫入（upsert）
async function supa_set(id,co,type,data){
  try{
    await fetch(SUPA_URL+'/rest/v1/records',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({id:id,co:co,type:type,data:data,updated_at:new Date().toISOString()})
    });
  }catch(e){}
}

function make(tag,props){
  var kids=Array.prototype.slice.call(arguments,2);
  var e=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      if(k==='class')e.className=props[k];
      else if(k==='style'&&typeof props[k]==='object')Object.assign(e.style,props[k]);
      else if(k==='onclick')e.addEventListener('click',props[k]);
      else e[k]=props[k];
    });
  }
  kids.forEach(function(c){
    if(c==null)return;
    if(Array.isArray(c)){c.forEach(function(cc){if(cc!=null)e.appendChild(cc instanceof Node?cc:document.createTextNode(String(cc)));});}
    else e.appendChild(c instanceof Node?c:document.createTextNode(String(c)));
  });
  return e;
}
function div(p){var k=Array.prototype.slice.call(arguments,1);return make.apply(null,['div',p].concat(k));}
function span(p){var k=Array.prototype.slice.call(arguments,1);return make.apply(null,['span',p].concat(k));}
function td(p){var k=Array.prototype.slice.call(arguments,1);return make.apply(null,['td',p].concat(k));}
function th(p){var k=Array.prototype.slice.call(arguments,1);return make.apply(null,['th',p].concat(k));}
function tr(){var k=Array.prototype.slice.call(arguments);return make.apply(null,['tr',null].concat(k));}

function autoAddMonthlyExpenses(co){
  if(co!=='竑順')return;
  var now=new Date();
  var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var existing=store_get(mk(co,'company_exp'))||[];
  var fixed=[{item:'董事長薪水',amount:'50000'},{item:'公司租金',amount:'10000'},{item:'會計費用',amount:'40000'}];
  var toAdd=fixed.filter(function(f){
    return !existing.some(function(e){return e.item===f.item&&e.period===ym;});
  }).map(function(f){
    return {id:Date.now()+Math.random(),item:f.item,period:ym,amount:f.amount,freq:'每月',note:ym+' 自動新增'};
  });
  if(!toAdd.length)return;
  store_set(mk(co,'company_exp'),toAdd.concat(existing));
}

var AUTO_SYNC_TIMER=null;

// 每 23 小時 ping 一次 Supabase，防止免費方案自動暫停

  try{
    await fetch(SUPA_URL+'/rest/v1/records?limit=1',{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
  }catch(e){}
}

function loadAll(co){
  initDefaultData(co);
  autoAddMonthlyExpenses(co);
  // 先用 localStorage 快速顯示
  var p={co:co,view:'dashboard',modal:null,checkFilter:'全部',expFilter:'全部',filterSite:'全部',splitSite:'全部',search:''};
  [['invoices','invoices',[]],['expenses','expItems',[]],['company_exp','companyExp',[]],
   ['splits','splits',[]],['sites','sites',DEF_SITES],['vendors','vendors',DEF_VENDORS]
  ].forEach(function(x){
    var v=store_get(mk(co,x[0]));
    p[x[1]]=v!==null?v:x[2].slice();
  });
  upd(p);
  // 從 Supabase 同步最新資料（優先）
  syncFromSupabase(co);
  // 清除舊的自動同步計時器
  if(AUTO_SYNC_TIMER)clearInterval(AUTO_SYNC_TIMER);
  // 每 30 秒自動從 Supabase 同步一次
  AUTO_SYNC_TIMER=setInterval(function(){
    if(ST.co===co)syncFromSupabase(co);
  },30000);
}

async function syncFromSupabase(co){
  var keys=[['invoices','invoices'],['expenses','expItems'],['company_exp','companyExp'],['splits','splits'],['sites','sites'],['vendors','vendors']];
  var patch={};
  var hasUpdate=false;
  for(var i=0;i<keys.length;i++){
    var key=keys[i][0],field=keys[i][1];
    var id=mk(co,key);
    var remote=await supa_get(id);
    if(remote!==null){
      store_set(id,remote);
      patch[field]=remote;
      hasUpdate=true;
    }
  }
  if(hasUpdate&&ST.co===co){
    Object.assign(ST,patch);
    render();
  }
}

var getNet=function(r){return Math.max(0,(Number(r.total_amount)||0)-(Number(r.discount)||0));};
var getPaid=function(r){return (r.payments||[]).reduce(function(s,p){return s+(Number(p.amount)||0);},0);};
var getReserved=function(r){return Math.max(0,getNet(r)-getPaid(r));};
var isSettled=function(r){return getReserved(r)<=0;};

function siteStats(){
  var m={};
  ST.invoices.forEach(function(r){
    if(!m[r.site])m[r.site]={received:0,reserved:0,invoice:0,worker:0,material:0};
    m[r.site].received+=getPaid(r);m[r.site].reserved+=getReserved(r);m[r.site].invoice+=Number(r.total_amount)||0;
  });
  ST.expItems.forEach(function(r){
    if(!m[r.site])m[r.site]={received:0,reserved:0,invoice:0,worker:0,material:0};
    if(r.category==='工人支出')m[r.site].worker+=Number(r.amount)||0;
    else m[r.site].material+=Number(r.amount)||0;
  });
  return m;
}

function importCSV(file){
  if(!confirm('匯入會覆蓋目前所有資料，確定繼續？'))return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var text=ev.target.result.replace(/^\uFEFF/,'');
      var rows=text.split('\n').map(function(r){var res=[],cur='',inQ=false;for(var i=0;i<r.length;i++){if(r[i]==='"'){if(inQ&&r[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(r[i]===','&&!inQ){res.push(cur.trim());cur='';}else cur+=r[i];}res.push(cur.trim());return res;});
      var ni=[],ne=[],nc=[],ns=[],mode='',cur=null;
      rows.forEach(function(row){
        if(!row[0])return;var t=row[0];
        if(t==='#類型'){if(row[4]==='發票號碼')mode='inv';else if(row[4]==='費用類別')mode='exp';else if(row[1]==='項目')mode='comp';else if(row[3]==='分給吉哥')mode='split';return;}
        if(mode==='inv'){if(t==='發票'){if(cur)ni.push(cur);cur={id:Date.now()+Math.random(),date:row[1],site:row[2],vendor:row[3],inv_no:row[4],inv_date:row[5],total_amount:row[6],discount:row[7],note:row[8],payments:[]};if(row[9])cur.payments.push({id:Date.now()+Math.random(),date:row[9],check_date:row[10],amount:row[11],method:row[12],note:row[13]});}else if(t===''&&cur&&row[9])cur.payments.push({id:Date.now()+Math.random(),date:row[9],check_date:row[10],amount:row[11],method:row[12],note:row[13]});}
        else if(mode==='exp'&&t==='支出')ne.push({id:Date.now()+Math.random(),date:row[1],site:row[2],vendor:row[3],category:row[4],amount:row[5],note:row[6]});
        else if(mode==='comp'&&t==='公司支出')nc.push({id:Date.now()+Math.random(),item:row[1],period:row[2],amount:row[3],freq:row[4],note:row[5]});
        else if(mode==='split'&&t==='分帳')ns.push({id:Date.now()+Math.random(),date:row[1],site:row[2],geo:row[3],sister:row[4],note:row[5]});
      });
      if(cur)ni.push(cur);
      saveK('invoices',ni);saveK('expenses',ne);
      if(ST.co==='竑順')saveK('company_exp',nc);
      if(ST.co==='吉諦')saveK('splits',ns);
      alert('匯入成功！');loadAll(ST.co);
    }catch(err){alert('匯入失敗');}
  };
  reader.readAsText(file,'UTF-8');
}

        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        var toast=div({style:{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'#1a1a1a',color:'#fff',padding:'8px 18px',borderRadius:'8px',fontSize:'13px',zIndex:999}});
        toast.textContent='已複製：'+text;document.body.appendChild(toast);
        setTimeout(function(){document.body.removeChild(toast);},1500);
      });
    }

    function showVdbModal(editId){
      var existing=editId?VENDORS_DB.find(function(v){return v.id===editId;}):null;
      var form={name:'',bank:'',branch:'',account:'',tax:''};
      if(existing)Object.assign(form,existing);
      var ov2=div({class:'ov'});
      var md=div({class:'modal-sm'});
      md.appendChild(div({style:{fontWeight:'700',fontSize:'15px',marginBottom:'16px'}},editId?'編輯廠商資料':'新增廠商'));
      var fg=div({class:'fg'});
      function vdbInp(lbText,key,full){
        var el=make('input',{type:'text',value:form[key]||'',placeholder:lbText});
        el.addEventListener('input',function(e){form[key]=e.target.value;});
        var w=div({style:full?{gridColumn:'1/-1'}:{}});
        w.appendChild(make('label',{style:{fontSize:'11px',color:'#888',marginBottom:'3px',display:'block'}},lbText));
        w.appendChild(el);fg.appendChild(w);
      }
      vdbInp('廠商名稱','name',true);
      vdbInp('所屬銀行代碼','bank',false);
      vdbInp('分行代碼','branch',false);
      vdbInp('銀行帳戶','account',true);
      vdbInp('統一編號','tax',true);
      md.appendChild(fg);
      var btns=div({style:{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'16px'}});
      btns.appendChild(ghostBtn('取消',function(){document.body.removeChild(ov2);}));
      btns.appendChild(mkBtn(editId?'儲存':'新增',accent,'#fff',function(){
        if(!form.name.trim()){alert('請填入廠商名稱');return;}
        if(editId){
          VENDORS_DB=VENDORS_DB.map(function(v){return v.id===editId?Object.assign({},v,form):v;});
        }else{
          form.id='vdb_'+Date.now();
          VENDORS_DB=VENDORS_DB.concat([form]);
        }
        saveVDB();document.body.removeChild(ov2);render();
      }));
      md.appendChild(btns);ov2.appendChild(md);
      ov2.addEventListener('click',function(e){if(e.target===ov2)document.body.removeChild(ov2);});
      document.body.appendChild(ov2);
    }

    var vdbSearch=ST.vdbSearch||'';
    var filtered=VENDORS_DB.filter(function(v){
      if(!vdbSearch)return true;
      return (v.name+v.bank+v.branch+v.account+v.tax).indexOf(vdbSearch)>=0;
    });
    var topRow=div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px',flexWrap:'wrap',gap:'8px'}});
    var leftTop=div({style:{display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}});
    leftTop.appendChild(div({style:{fontWeight:'600',fontSize:'14px'}},'廠商轉帳資料'));
    var si=make('input',{type:'text',placeholder:'搜尋廠商名稱、帳號...',style:{width:'200px'},value:vdbSearch});
    si.addEventListener('input',function(e){ST.vdbSearch=e.target.value;render();});
    leftTop.appendChild(si);
    topRow.appendChild(leftTop);
    topRow.appendChild(mkBtn('+ 新增廠商',accent,'#fff',function(){showVdbModal(null);}));
    main.appendChild(topRow);
    main.appendChild(div({style:{fontSize:'11px',color:'#888',marginBottom:'8px'}},'點擊資料欄位可複製內容'));
    var card=div({class:'card'});
    var ow=div({style:{overflowX:'auto'}});
    var tbl=make('table',{class:'tbl'});
    tbl.appendChild(make('thead',{},tr(
      th({style:{minWidth:'160px'}},'廠商名稱'),
      th({style:{minWidth:'60px'}},'所屬銀行'),
      th({style:{minWidth:'60px'}},'分行'),
      th({style:{minWidth:'160px'}},'銀行帳戶'),
      th({style:{minWidth:'90px'}},'統編'),
      th({style:{minWidth:'70px'}},'操作')
    )));
    var tbody=make('tbody');
    if(!filtered.length)tbody.appendChild(tr(make('td',{colspan:6,style:{textAlign:'center',color:'#888',padding:'28px'}},'查無資料')));

    function makeCell(text,isAccount){
      var c=td({style:{cursor:text?'pointer':'default',userSelect:'text'}},text||'-');
      if(text){
        if(isAccount){c.style.fontFamily='monospace';c.style.fontSize='13px';c.style.fontWeight='600';c.style.color='#185FA5';}
        c.title='點擊複製';
        c.addEventListener('click',function(){copyCell(text);});
        c.addEventListener('mouseenter',function(){c.style.background='#EEF6FF';});
        c.addEventListener('mouseleave',function(){c.style.background='';});
      }
      return c;
    }

    filtered.forEach(function(v){
      var editB=document.createElement('button');editB.textContent='✎';editB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#888;cursor:pointer;margin-right:3px;';
      editB.addEventListener('click',(function(id){return function(){showVdbModal(id);};})(v.id));
      var delB=document.createElement('button');delB.textContent='✕';delB.style.cssText='background:transparent;border:0.5px solid #ccc;border-radius:6px;padding:2px 6px;font-size:10px;color:#A32D2D;cursor:pointer;';
      delB.addEventListener('click',(function(id,name){return function(){
        if(!confirm('確定刪除「'+name+'」？'))return;
        VENDORS_DB=VENDORS_DB.filter(function(x){return x.id!==id;});
        saveVDB();render();
      };})(v.id,v.name));
      var opTd=td({});opTd.appendChild(editB);opTd.appendChild(delB);
      tbody.appendChild(tr(makeCell(v.name,false),makeCell(v.bank,false),makeCell(v.branch,false),makeCell(v.account,true),makeCell(v.tax,false),opTd));
    });
    tbl.appendChild(tbody);ow.appendChild(tbl);card.appendChild(ow);main.appendChild(card);
  }

  app.appendChild(main);
  if(modal==='inv')app.appendChild(renderInvModal());
  if(modal==='exp')app.appendChild(renderExpModal());
  if(modal==='pay'&&payModalId)app.appendChild(renderPayModal());
  if(modal==='compExp')app.appendChild(renderCompExpModal());
  if(modal==='split')app.appendChild(renderSplitModal());
}

render();
</script>
</body>
</html>

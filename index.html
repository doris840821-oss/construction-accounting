<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>竑順／吉諦 工地帳務管理</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const COMPANIES = ["竑順", "吉諦"];
    const EXPENSE_CATS = ["工人支出", "五金材料支出"];
    const FREQ_OPTS = ["每月", "每兩月", "每季", "每年", "單次"];
    const PAY_METHODS = ["現金收款", "銀行匯款", "支票"];

    const fmt = n => isNaN(n) || n === "" ? "0" : Number(n).toLocaleString("zh-TW");
    const today = () => new Date().toISOString().split("T")[0];
    const mk = (co, key) => `hs26_${co}_${key}`;

    const DEFAULT_SITES = ["板橋遠雄"];
    const DEFAULT_VENDORS = ["吉諦", "哲在"];

    const storage = {
      get: (key) => { try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; } },
      set: (key, value) => { try { localStorage.setItem(key, value); return true; } catch { return null; } }
    };

    function App() {
      const [co, setCo] = useState(null);
      const [invoices, setInvoices] = useState([]);
      const [expItems, setExpItems] = useState([]);
      const [companyExp, setCompanyExp] = useState([]);
      const [sites, setSites] = useState(DEFAULT_SITES);
      const [vendors, setVendors] = useState(DEFAULT_VENDORS);
      const [view, setView] = useState("dashboard");
      const [loading, setLoading] = useState(false);

      const [checkFilter, setCheckFilter] = useState("全部");
      const [expFilter, setExpFilter] = useState("全部");
      const [filterSite, setFilterSite] = useState("全部");
      const [search, setSearch] = useState("");

      const [showInvForm, setShowInvForm] = useState(false);
      const [showExpForm, setShowExpForm] = useState(false);
      const [showCompExpForm, setShowCompExpForm] = useState(false);
      const [showPayModal, setShowPayModal] = useState(null);
      const [editInvId, setEditInvId] = useState(null);
      const [editExpId, setEditExpId] = useState(null);
      const [editCompExpId, setEditCompExpId] = useState(null);

      const [addingSite, setAddingSite] = useState(false);
      const [addingVendor, setAddingVendor] = useState(false);
      const [inlineSite, setInlineSite] = useState("");
      const [inlineVendor, setInlineVendor] = useState("");

      const emptyInv = () => ({ date: today(), site: sites[0] || "", vendor: "", inv_no: "", inv_date: "", total_amount: "", discount: "", note: "", payments: [] });
      const emptyExp = () => ({ date: today(), site: sites[0] || "", vendor: "", category: "工人支出", amount: "", note: "" });
      const emptyCompExp = () => ({ item: "", period: "", amount: "", freq: "每月", note: "" });
      const emptyPay = () => ({ date: today(), check_date: "", amount: "", method: "現金收款", note: "" });

      const [invForm, setInvForm] = useState(emptyInv());
      const [expForm, setExpForm] = useState(emptyExp());
      const [compExpForm, setCompExpForm] = useState(emptyCompExp());
      const [payEntry, setPayEntry] = useState(emptyPay());

      useEffect(() => { if (co) loadAll(co); }, [co]);

      function loadAll(company) {
        setLoading(true);
        const defs = [
          [mk(company, "invoices"), setInvoices, []],
          [mk(company, "expenses"), setExpItems, []],
          [mk(company, "company_exp"), setCompanyExp, []],
          [mk(company, "sites"), setSites, DEFAULT_SITES],
          [mk(company, "vendors"), setVendors, DEFAULT_VENDORS],
        ];
        for (const [key, setter, def] of defs) {
          try { const r = storage.get(key); setter(r?.value ? JSON.parse(r.value) : def); } catch { setter(def); }
        }
        setView("dashboard"); setCheckFilter("全部"); setExpFilter("全部"); setFilterSite("全部"); setSearch("");
        setLoading(false);
      }

      const save = (key, data) => { try { storage.set(mk(co, key), JSON.stringify(data)); } catch { } };

      function inlineAddSite(val, cb) {
        const v = val.trim(); if (!v) return;
        const u = sites.includes(v) ? sites : [...sites, v]; setSites(u); save("sites", u);
        cb(v); setAddingSite(false); setInlineSite("");
      }
      function inlineAddVendor(val, cb) {
        const v = val.trim(); if (!v) return;
        const u = vendors.includes(v) ? vendors : [...vendors, v]; setVendors(u); save("vendors", u);
        cb(v); setAddingVendor(false); setInlineVendor("");
      }

      const SiteSelect = ({ value, onChange }) => (
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          {addingSite
            ? <div style={{ display: "flex", gap: 4, flex: 1 }}>
                <input autoFocus style={{ ...S.inp, flex: 1 }} value={inlineSite} onChange={e => setInlineSite(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && inlineAddSite(inlineSite, onChange)} placeholder="新工地名稱..." />
                <button style={S.btn()} onClick={() => inlineAddSite(inlineSite, onChange)}>確認</button>
                <button style={S.ghost} onClick={() => { setAddingSite(false); setInlineSite(""); }}>✕</button>
              </div>
            : <>
                <select style={S.inp} value={value} onChange={e => onChange(e.target.value)}>
                  <option value="">請選擇工地</option>{sites.map(x => <option key={x}>{x}</option>)}
                </select>
                <button style={{ ...S.ghost, whiteSpace: "nowrap", padding: "6px 10px" }} onClick={() => setAddingSite(true)}>＋ 新增</button>
              </>}
        </div>
      );

      const VendorSelect = ({ value, onChange }) => (
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          {addingVendor
            ? <div style={{ display: "flex", gap: 4, flex: 1 }}>
                <input autoFocus style={{ ...S.inp, flex: 1 }} value={inlineVendor} onChange={e => setInlineVendor(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && inlineAddVendor(inlineVendor, onChange)} placeholder="新廠商名稱..." />
                <button style={S.btn()} onClick={() => inlineAddVendor(inlineVendor, onChange)}>確認</button>
                <button style={S.ghost} onClick={() => { setAddingVendor(false); setInlineVendor(""); }}>✕</button>
              </div>
            : <>
                <select style={S.inp} value={value} onChange={e => onChange(e.target.value)}>
                  <option value="">請選擇廠商</option>{vendors.map(v => <option key={v} value={v}>{v}</option>)}
                </select>
                <button style={{ ...S.ghost, whiteSpace: "nowrap", padding: "6px 10px" }} onClick={() => setAddingVendor(true)}>＋ 新增</button>
              </>}
        </div>
      );

      const getNet = r => Math.max(0, (Number(r.total_amount) || 0) - (Number(r.discount) || 0));
      const getPaid = r => (r.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
      const getReserved = r => Math.max(0, getNet(r) - getPaid(r));
      const isSettled = r => getReserved(r) <= 0;

      const filteredChecks = useMemo(() => invoices.filter(r => {
        if (checkFilter === "未收完") return getReserved(r) > 0;
        if (checkFilter === "已結清") return isSettled(r);
        return true;
      }), [invoices, checkFilter]);

      const filteredExp = useMemo(() => expItems.filter(r => {
        if (expFilter !== "全部" && r.category !== expFilter) return false;
        if (filterSite !== "全部" && r.site !== filterSite) return false;
        return true;
      }), [expItems, expFilter, filterSite]);

      const ledger = useMemo(() => {
        const rows = [];
        invoices.forEach(inv => rows.push({
          id: `inv-${inv.id}`, date: inv.date, site: inv.site, vendor: inv.vendor,
          type: "開出發票", io: "收入", amount: Number(inv.total_amount) || 0,
          net: getNet(inv), paid: getPaid(inv), reserved: getReserved(inv), inv_no: inv.inv_no, note: inv.note
        }));
        expItems.forEach(e => rows.push({
          id: `exp-${e.id}`, date: e.date, site: e.site, vendor: e.vendor,
          type: e.category, io: "支出", amount: Number(e.amount) || 0,
          net: Number(e.amount) || 0, paid: Number(e.amount) || 0, reserved: 0, note: e.note
        }));
        return rows.sort((a, b) => b.date.localeCompare(a.date));
      }, [invoices, expItems]);

      const filteredLedger = useMemo(() => ledger.filter(r => {
        if (filterSite !== "全部" && r.site !== filterSite) return false;
        if (search && !`${r.site}${r.vendor}${r.inv_no || ""}${r.note || ""}`.includes(search)) return false;
        return true;
      }), [ledger, filterSite, search]);

      const totalIncome = invoices.reduce((s, r) => s + getPaid(r), 0);
      const totalReserved = invoices.reduce((s, r) => s + getReserved(r), 0);
      const totalExpense = expItems.reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const totalCompanyExp = companyExp.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const grandProfit = totalIncome - totalExpense;

      const siteStats = useMemo(() => {
        const map = {};
        invoices.forEach(r => {
          if (!map[r.site]) map[r.site] = { received: 0, reserved: 0, invoice: 0, worker: 0, material: 0 };
          map[r.site].received += getPaid(r); map[r.site].reserved += getReserved(r);
          map[r.site].invoice += Number(r.total_amount) || 0;
        });
        expItems.forEach(r => {
          if (!map[r.site]) map[r.site] = { received: 0, reserved: 0, invoice: 0, worker: 0, material: 0 };
          if (r.category === "工人支出") map[r.site].worker += Number(r.amount) || 0;
          else map[r.site].material += Number(r.amount) || 0;
        });
        return map;
      }, [invoices, expItems]);

      const compExpByFreq = useMemo(() => {
        const m = {}; FREQ_OPTS.forEach(f => m[f] = []);
        companyExp.forEach(e => { if (m[e.freq]) m[e.freq].push(e); });
        return m;
      }, [companyExp]);

      function saveInvoice() {
        if (!invForm.total_amount || !invForm.site) return alert("請填寫工地和發票金額");
        const rec = { ...invForm, id: editInvId || Date.now(), payments: invForm.payments || [] };
        const u = editInvId ? invoices.map(r => r.id === editInvId ? rec : r) : [rec, ...invoices];
        setInvoices(u); save("invoices", u); setShowInvForm(false); setEditInvId(null);
      }
      function delInvoice(id) {
        if (!window.confirm("確定刪除？")) return;
        const u = invoices.filter(r => r.id !== id); setInvoices(u); save("invoices", u);
      }
      function addPayment(invId) {
        if (!payEntry.amount) return alert("請填寫金額");
        const u = invoices.map(r => r.id !== invId ? r : { ...r, payments: [...(r.payments || []), { ...payEntry, id: Date.now() }] });
        setInvoices(u); save("invoices", u); setPayEntry(emptyPay()); setShowPayModal(null);
      }
      function delPayment(invId, payId) {
        const u = invoices.map(r => r.id !== invId ? r : { ...r, payments: (r.payments || []).filter(p => p.id !== payId) });
        setInvoices(u); save("invoices", u);
      }
      function saveExpItem() {
        if (!expForm.amount || !expForm.site) return alert("請填寫工地和金額");
        const rec = { ...expForm, id: editExpId || Date.now() };
        const u = editExpId ? expItems.map(r => r.id === editExpId ? rec : r) : [rec, ...expItems];
        setExpItems(u); save("expenses", u); setShowExpForm(false); setEditExpId(null);
      }
      function delExpItem(id) {
        if (!window.confirm("確定刪除？")) return;
        const u = expItems.filter(r => r.id !== id); setExpItems(u); save("expenses", u);
      }
      function saveCompExp() {
        if (!compExpForm.item || !compExpForm.amount) return alert("請填寫項目和金額");
        const rec = { ...compExpForm, id: editCompExpId || Date.now() };
        const u = editCompExpId ? companyExp.map(e => e.id === editCompExpId ? rec : e) : [rec, ...companyExp];
        setCompanyExp(u); save("company_exp", u); setShowCompExpForm(false); setEditCompExpId(null);
      }
      function delCompExp(id) {
        const u = companyExp.filter(e => e.id !== id); setCompanyExp(u); save("company_exp", u);
      }

      function exportCSV() {
        const rows = [];
        rows.push(["#類型","日期","工地","廠商","發票號碼","發票日期","發票金額","折讓","備註","收款日期","票期日期","收款金額","收款方式","收款備註"]);
        invoices.forEach(inv => {
          if ((inv.payments || []).length === 0) {
            rows.push(["發票", inv.date, inv.site, inv.vendor||"", inv.inv_no||"", inv.inv_date||"", inv.total_amount||"", inv.discount||"", inv.note||"", "", "", "", "", ""]);
          } else {
            (inv.payments || []).forEach((p, i) => {
              rows.push([
                i===0?"發票":"", i===0?inv.date:"", i===0?inv.site:"", i===0?(inv.vendor||""):"",
                i===0?(inv.inv_no||""):"", i===0?(inv.inv_date||""):"",
                i===0?(inv.total_amount||""):"", i===0?(inv.discount||""):"", i===0?(inv.note||""):"",
                p.date||"", p.check_date||"", p.amount||"", p.method||"", p.note||""
              ]);
            });
          }
        });
        rows.push([]);
        rows.push(["#類型","日期","工地","廠商","費用類別","金額","備註"]);
        expItems.forEach(e => rows.push(["支出", e.date, e.site, e.vendor||"", e.category, e.amount||"", e.note||""]));
        if (co === "竑順" && companyExp.length > 0) {
          rows.push([]);
          rows.push(["#類型","項目","區間","金額","頻率","備註"]);
          companyExp.forEach(e => rows.push(["公司支出", e.item, e.period||"", e.amount||"", e.freq, e.note||""]));
        }
        const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
        const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
        a.download = `${co}_帳務備份_${today()}.csv`; a.click();
      }

      function importCSV(e) {
        const file = e.target.files[0]; if (!file) return;
        if (!window.confirm("匯入會覆蓋目前所有資料，確定繼續？")) { e.target.value = ""; return; }
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const text = ev.target.result.replace(/^\uFEFF/, "");
            const rows = text.split("\n").map(r => {
              const res = []; let cur = "", inQ = false;
              for (let i = 0; i < r.length; i++) {
                if (r[i] === '"') { if (inQ && r[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
                else if (r[i] === ',' && !inQ) { res.push(cur.trim()); cur = ""; }
                else cur += r[i];
              }
              res.push(cur.trim()); return res;
            });
            const newInvoices = [], newExpItems = [], newCompExp = [];
            let mode = "", curInv = null;
            for (const row of rows) {
              if (!row[0]) continue;
              const type = row[0].replace(/^"/, "").replace(/"$/, "");
              if (type === "#類型") {
                if (row[4] === "發票號碼") mode = "invoice";
                else if (row[4] === "費用類別") mode = "expense";
                else if (row[1] === "項目") mode = "company";
                continue;
              }
              if (mode === "invoice") {
                if (type === "發票") {
                  if (curInv) newInvoices.push(curInv);
                  curInv = { id: Date.now()+Math.random(), date: row[1], site: row[2], vendor: row[3], inv_no: row[4], inv_date: row[5], total_amount: row[6], discount: row[7], note: row[8], payments: [] };
                  if (row[9]) curInv.payments.push({ id: Date.now()+Math.random(), date: row[9], check_date: row[10], amount: row[11], method: row[12], note: row[13] });
                } else if (type === "" && curInv && row[9]) {
                  curInv.payments.push({ id: Date.now()+Math.random(), date: row[9], check_date: row[10], amount: row[11], method: row[12], note: row[13] });
                }
              } else if (mode === "expense" && type === "支出") {
                newExpItems.push({ id: Date.now()+Math.random(), date: row[1], site: row[2], vendor: row[3], category: row[4], amount: row[5], note: row[6] });
              } else if (mode === "company" && type === "公司支出") {
                newCompExp.push({ id: Date.now()+Math.random(), item: row[1], period: row[2], amount: row[3], freq: row[4], note: row[5] });
              }
            }
            if (curInv) newInvoices.push(curInv);
            setInvoices(newInvoices); save("invoices", newInvoices);
            setExpItems(newExpItems); save("expenses", newExpItems);
            if (co === "竑順") { setCompanyExp(newCompExp); save("company_exp", newCompExp); }
            alert("匯入成功！");
          } catch { alert("匯入失敗，請確認檔案格式正確。"); }
          e.target.value = "";
        };
        reader.readAsText(file, "UTF-8");
      }

      const currentPayInv = showPayModal ? invoices.find(r => r.id === showPayModal) : null;
      const coColor = { "竑順": "#1D9E75", "吉諦": "#378ADD" };

      const S = {
        app: { fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", color: "#1a1a1a", minHeight: "100vh", background: "#f5f5f7" },
        hdr: { background: "#fff", borderBottom: "0.5px solid #e0e0e0", padding: "0 14px", display: "flex", alignItems: "center", gap: 10, height: 50, flexWrap: "wrap" },
        nb: (a) => ({ background: a ? "#f0f0f0" : "transparent", border: "none", borderRadius: 6, padding: "5px 11px", cursor: "pointer", fontSize: 12, fontWeight: a ? 600 : 400, color: a ? "#1a1a1a" : "#888" }),
        main: { padding: 14, maxWidth: 1100, margin: "0 auto" },
        card: { background: "#fff", border: "0.5px solid #e0e0e0", borderRadius: 12, padding: "14px 16px", marginBottom: 12 },
        mg: { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))", gap: 10, marginBottom: 12 },
        metric: (c) => ({ background: "#f5f5f7", borderRadius: 8, padding: "11px 13px", borderLeft: `3px solid ${c}` }),
        ml: { fontSize: 11, color: "#888", marginBottom: 2 },
        mv: { fontSize: 16, fontWeight: 600 },
        row: { display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" },
        sel: { border: "0.5px solid #ccc", borderRadius: 6, padding: "5px 8px", fontSize: 12, background: "#fff", color: "#1a1a1a" },
        inp: { border: "0.5px solid #ccc", borderRadius: 6, padding: "6px 9px", fontSize: 13, background: "#fff", color: "#1a1a1a", width: "100%", boxSizing: "border-box" },
        btn: (c = "#1D9E75") => ({ background: c, color: "#fff", border: "none", borderRadius: 6, padding: "7px 14px", cursor: "pointer", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }),
        ghost: { background: "transparent", border: "0.5px solid #ccc", borderRadius: 6, padding: "5px 10px", cursor: "pointer", fontSize: 12, color: "#888" },
        tbl: { width: "100%", borderCollapse: "collapse", fontSize: 12 },
        th: { textAlign: "left", padding: "7px 9px", borderBottom: "0.5px solid #e0e0e0", color: "#888", fontWeight: 500, fontSize: 11, whiteSpace: "nowrap" },
        td: { padding: "8px 9px", borderBottom: "0.5px solid #e0e0e0", verticalAlign: "middle" },
        ov: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 },
        modal: { background: "#fff", borderRadius: 12, padding: 22, width: "min(560px,95vw)", maxHeight: "90vh", overflowY: "auto" },
        fg: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 },
        lbl: { fontSize: 11, color: "#888", marginBottom: 3, display: "block" },
        pill: (a, c = "#1D9E75") => ({ padding: "5px 14px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 12, fontWeight: a ? 600 : 400, background: a ? c : "#f0f0f0", color: a ? "#fff" : "#888" }),
      };

      if (!co) return (
        <div style={{ ...S.app, display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 32, marginBottom: 8 }}>🏗</div>
            <div style={{ fontWeight: 700, fontSize: 22, marginBottom: 4 }}>2026 工地帳務管理</div>
            <div style={{ color: "#888", fontSize: 13, marginBottom: 32 }}>請選擇要操作的公司</div>
            <div style={{ display: "flex", gap: 16, justifyContent: "center" }}>
              {COMPANIES.map(c => (
                <button key={c} onClick={() => setCo(c)} style={{
                  background: coColor[c], color: "#fff", border: "none", borderRadius: 12,
                  padding: "24px 40px", cursor: "pointer", fontSize: 18, fontWeight: 700,
                  boxShadow: "0 4px 16px rgba(0,0,0,0.12)"
                }}>{c}</button>
              ))}
            </div>
          </div>
        </div>
      );

      if (loading) return <div style={{ ...S.app, display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}><span>載入中...</span></div>;

      const accent = coColor[co];
      const navItems = [["dashboard","總覽"],["checks","收款管理"],["expenses","支出管理"],["ledger","帳務紀錄"],...(co==="竑順"?[["company_exp","公司支出"]]:[]),["profit","損益報表"]];

      return (
        <div style={S.app}>
          <div style={S.hdr}>
            <button onClick={() => setCo(null)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20 }}>🏗</button>
            <span style={{ fontWeight: 700, fontSize: 15, color: accent }}>{co}</span>
            <span style={{ fontSize: 11, color: "#888" }}>工地帳務</span>
            <div style={{ display: "flex", gap: 6, marginLeft: 4 }}>
              {COMPANIES.map(c => (

                        {v.reserved>0&&<><span style={{color:"#888"}}>保留款</span><span style={{textAlign:"right",color:"#854F0B"}}>NT$ {fmt(v.reserved)}</span></>}
                        {v.worker>0&&<><span style={{color:"#888"}}>工人支出</span><span style={{textAlign:"right",color:"#A32D2D"}}>-NT$ {fmt(v.worker)}</span></>}
                        {v.material>0&&<><span style={{color:"#888"}}>五金材料</span><span style={{textAlign:"right",color:"#A32D2D"}}>-NT$ {fmt(v.material)}</span></>}
                        {v.invoice>0&&<><span style={{color:"#888"}}>開出發票</span><span style={{textAlign:"right"}}>NT$ {fmt(v.invoice)}</span></>}
                      </div>
                      <div style={{borderTop:"0.5px solid #e0e0e0",marginTop:8,paddingTop:7,display:"flex",justifyContent:"space-between"}}>
                        <span style={{fontSize:11,color:"#888"}}>損益</span>
                        <span style={{fontWeight:700,fontSize:15,color:p>=0?"#185FA5":"#A32D2D"}}>NT$ {fmt(p)}</span>
                      </div>
                    </div>;
                  })}
                </div>
              </>
            )}
          </div>

          {showInvForm&&<div style={S.ov} onClick={e=>e.target===e.currentTarget&&setShowInvForm(false)}>
            <div style={S.modal}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:16}}>{editInvId?"編輯發票":"新增開出發票"}</div>
              <div style={S.fg}>
                <div><label style={S.lbl}>日期</label><input type="date" style={S.inp} value={invForm.date} onChange={e=>setInvForm(f=>({...f,date:e.target.value}))}/></div>
                <div><label style={S.lbl}>發票號碼</label><input style={S.inp} value={invForm.inv_no} onChange={e=>setInvForm(f=>({...f,inv_no:e.target.value}))} placeholder="發票號碼"/></div>
                <div style={{gridColumn:"1/-1"}}><label style={S.lbl}>工地</label><SiteSelect value={invForm.site} onChange={v=>setInvForm(f=>({...f,site:v}))}/></div>
                <div style={{gridColumn:"1/-1"}}><label style={S.lbl}>廠商</label><VendorSelect value={invForm.vendor} onChange={v=>setInvForm(f=>({...f,vendor:v}))}/></div>
                <div><label style={S.lbl}>發票日期</label><input type="date" style={S.inp} value={invForm.inv_date} onChange={e=>setInvForm(f=>({...f,inv_date:e.target.value}))}/></div>
                <div><label style={S.lbl}>發票金額</label><input type="number" style={S.inp} value={invForm.total_amount} onChange={e=>setInvForm(f=>({...f,total_amount:e.target.value}))} placeholder="0"/></div>
                <div><label style={S.lbl}>折讓金額</label><input type="number" style={S.inp} value={invForm.discount||""} onChange={e=>setInvForm(f=>({...f,discount:e.target.value}))} placeholder="0（無折讓可留空）"/></div>
              </div>
              <div style={{marginBottom:10}}><label style={S.lbl}>備註</label><textarea style={{...S.inp,height:50,resize:"vertical"}} value={invForm.note} onChange={e=>setInvForm(f=>({...f,note:e.target.value}))} placeholder="備註..."/></div>
              <div style={{...S.row,justifyContent:"flex-end",gap:8}}>
                <button style={S.ghost} onClick={()=>setShowInvForm(false)}>取消</button>
                <button style={S.btn(accent)} onClick={saveInvoice}>儲存</button>
              </div>
            </div>
          </div>}

          {showExpForm&&<div style={S.ov} onClick={e=>e.target===e.currentTarget&&setShowExpForm(false)}>
            <div style={S.modal}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:16}}>{editExpId?"編輯支出":"新增支出"}</div>
              <div style={S.fg}>
                <div><label style={S.lbl}>日期</label><input type="date" style={S.inp} value={expForm.date} onChange={e=>setExpForm(f=>({...f,date:e.target.value}))}/></div>
                <div><label style={S.lbl}>費用類別</label>
                  <select style={S.inp} value={expForm.category} onChange={e=>setExpForm(f=>({...f,category:e.target.value}))}>
                    {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}
                  </select></div>
                <div style={{gridColumn:"1/-1"}}><label style={S.lbl}>工地</label><SiteSelect value={expForm.site} onChange={v=>setExpForm(f=>({...f,site:v}))}/></div>
                <div style={{gridColumn:"1/-1"}}><label style={S.lbl}>廠商</label><VendorSelect value={expForm.vendor} onChange={v=>setExpForm(f=>({...f,vendor:v}))}/></div>
                <div><label style={S.lbl}>金額</label><input type="number" style={S.inp} value={expForm.amount} onChange={e=>setExpForm(f=>({...f,amount:e.target.value}))} placeholder="0"/></div>
              </div>
              <div style={{marginBottom:10}}><label style={S.lbl}>備註</label><textarea style={{...S.inp,height:50,resize:"vertical"}} value={expForm.note} onChange={e=>setExpForm(f=>({...f,note:e.target.value}))} placeholder="備註..."/></div>
              <div style={{...S.row,justifyContent:"flex-end",gap:8}}>
                <button style={S.ghost} onClick={()=>setShowExpForm(false)}>取消</button>
                <button style={S.btn("#E24B4A")} onClick={saveExpItem}>儲存</button>
              </div>
            </div>
          </div>}

          {showPayModal&&currentPayInv&&<div style={S.ov} onClick={e=>e.target===e.currentTarget&&setShowPayModal(null)}>
            <div style={{...S.modal,width:"min(400px,95vw)"}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>新增收款記錄</div>
              <div style={{fontSize:12,color:"#888",marginBottom:14}}>{currentPayInv.vendor||currentPayInv.site} · 尚未收款 NT$ {fmt(getReserved(currentPayInv))}</div>
              <div style={{display:"grid",gap:10}}>
                <div><label style={S.lbl}>收款日期</label><input type="date" style={S.inp} value={payEntry.date} onChange={e=>setPayEntry(p=>({...p,date:e.target.value}))}/></div>
                <div><label style={S.lbl}>匯款／支票日期</label><input type="date" style={S.inp} value={payEntry.check_date} onChange={e=>setPayEntry(p=>({...p,check_date:e.target.value}))}/></div>
                <div><label style={S.lbl}>收款金額</label><input type="number" style={S.inp} value={payEntry.amount} onChange={e=>setPayEntry(p=>({...p,amount:e.target.value}))} placeholder={`最多 NT$ ${fmt(getReserved(currentPayInv))}`}/></div>
                <div><label style={S.lbl}>收款方式</label>
                  <select style={S.inp} value={payEntry.method} onChange={e=>setPayEntry(p=>({...p,method:e.target.value}))}>
                    {PAY_METHODS.map(m=><option key={m}>{m}</option>)}
                  </select></div>
                <div><label style={S.lbl}>備註</label><input style={S.inp} value={payEntry.note} onChange={e=>setPayEntry(p=>({...p,note:e.target.value}))} placeholder="備註..."/></div>
              </div>
              <div style={{...S.row,justifyContent:"flex-end",marginTop:14,gap:8}}>
                <button style={S.ghost} onClick={()=>setShowPayModal(null)}>取消</button>
                <button style={S.btn(accent)} onClick={()=>addPayment(showPayModal)}>確認收款</button>
              </div>
            </div>
          </div>}

          {showCompExpForm&&<div style={S.ov} onClick={e=>e.target===e.currentTarget&&setShowCompExpForm(false)}>
            <div style={{...S.modal,width:"min(380px,95vw)"}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>{editCompExpId?"編輯":"新增"}公司支出</div>
              <div style={{display:"grid",gap:10}}>
                <div><label style={S.lbl}>項目</label><input style={S.inp} value={compExpForm.item} onChange={e=>setCompExpForm(f=>({...f,item:e.target.value}))} placeholder="例：董事長薪水"/></div>
                <div><label style={S.lbl}>區間</label><input style={S.inp} value={compExpForm.period} onChange={e=>setCompExpForm(f=>({...f,period:e.target.value}))} placeholder="例：2026-01"/></div>
                <div><label style={S.lbl}>金額</label><input type="number" style={S.inp} value={compExpForm.amount} onChange={e=>setCompExpForm(f=>({...f,amount:e.target.value}))} placeholder="0"/></div>
                <div><label style={S.lbl}>頻率</label>
                  <select style={S.inp} value={compExpForm.freq} onChange={e=>setCompExpForm(f=>({...f,freq:e.target.value}))}>
                    {FREQ_OPTS.map(x=><option key={x}>{x}</option>)}
                  </select></div>
                <div><label style={S.lbl}>備註</label><input style={S.inp} value={compExpForm.note} onChange={e=>setCompExpForm(f=>({...f,note:e.target.value}))} placeholder="備註..."/></div>
              </div>
              <div style={{...S.row,justifyContent:"flex-end",marginTop:14,gap:8}}>
                <button style={S.ghost} onClick={()=>setShowCompExpForm(false)}>取消</button>
                <button style={S.btn(accent)} onClick={saveCompExp}>儲存</button>
              </div>
            </div>
          </div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
